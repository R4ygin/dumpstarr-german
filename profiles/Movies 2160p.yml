name: Movies 2160p
description: 'This profile focuses on streaming optimized sources with little to no
  transcoding needed and is recommended for the average user or if you **do not**
  use a dedicated streaming box. (i.e. AppleTV, NVIDIA Shield, etc)

  - This profile is recommended for a set-it-and-forget-it setup.

  - This profile will prefer streaming optimized releases groups like **BHDStudio**
  and **hallowed**.

  - This profile does not allow releases with HD Audio to ensure direct-play compatibility.

  - Releases without HDR fallback will be scored negatively to ensure playability
  across platforms.'
